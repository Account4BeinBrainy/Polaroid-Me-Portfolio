<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project document</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e8e5;color:#202425;font:14px system-ui}header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:#f6f5f2}a{color:inherit}main{padding:10px}canvas{display:block;max-width:100%;height:auto;margin:0 auto 12px;background:white;box-shadow:0 1px 5px #0002}
</style>
<header><span id="status" role="status">Loading document…</span><a id="original" target="_blank" rel="noopener noreferrer">Open original PDF</a></header><main></main>
<script type="module">
import {getDocument,GlobalWorkerOptions} from './vendor/pdfjs/pdf.min.mjs';
GlobalWorkerOptions.workerSrc='./vendor/pdfjs/pdf.worker.min.mjs';
const file=new URLSearchParams(location.search).get('file');
const status=document.querySelector('#status'),main=document.querySelector('main'),link=document.querySelector('#original');
try {
 const url=new URL(file,location.origin);
 if(url.origin!==location.origin||!url.pathname.startsWith('/assets/projects/'))throw new Error('Invalid document');
 link.href=url.href;
 const pdf=await getDocument({url:url.href,cMapUrl:'./vendor/pdfjs/cmaps/',cMapPacked:true,standardFontDataUrl:'./vendor/pdfjs/standard_fonts/',wasmUrl:'./vendor/pdfjs/wasm/'}).promise;
 status.textContent=`${pdf.numPages} pages · Scroll to read`;
 for(let n=1;n<=pdf.numPages;n++){
  const page=await pdf.getPage(n),base=page.getViewport({scale:1});
  const scale=Math.max(1,(main.clientWidth-20)/base.width)*Math.min(devicePixelRatio,2);
  const viewport=page.getViewport({scale}),canvas=document.createElement('canvas');
  canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);canvas.setAttribute('aria-label',`Page ${n} of ${pdf.numPages}`);main.append(canvas);
  await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
 }
}catch(error){status.textContent='Unable to load document. Open the original PDF.';console.error(error);}
</script></html>
