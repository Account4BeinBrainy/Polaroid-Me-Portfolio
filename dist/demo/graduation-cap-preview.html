<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#f8f7f3');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
renderer.domElement.setAttribute('aria-label','黑色毕业帽与绿色金色双拼帽穗，可拖动旋转');renderer.domElement.tabIndex=0;
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.005,10);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(.012,.108,0);controls.enableDamping=true;controls.enablePan=false;controls.autoRotate=true;controls.autoRotateSpeed=.55;controls.minDistance=.35;controls.maxDistance=1.6;controls.maxPolarAngle=Math.PI*.87;
const pmrem=new THREE.PMREMGenerator(renderer), room=new RoomEnvironment(), env=pmrem.fromScene(room);scene.environment=env.texture;scene.environmentIntensity=.65;room.dispose();pmrem.dispose();
const key=new THREE.DirectionalLight(0xfff8ed,1.8);key.position.set(-.4,.65,.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-.32,right:.32,top:.32,bottom:-.32,near:.01,far:2});key.shadow.bias=-.00015;key.shadow.normalBias=.0003;key.shadow.radius=4;scene.add(key);
const fill=new THREE.DirectionalLight(0xeef2f5,.36);fill.position.set(.4,.25,.4);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({color:0x494039,opacity:.17}));floor.rotation.x=-Math.PI/2;floor.position.y=-.0005;floor.receiveShadow=true;scene.add(floor);
function fit(){camera.aspect=innerWidth/innerHeight;const distance=.68/Math.min(1,camera.aspect);camera.position.set(.32,.34,.49).normalize().multiplyScalar(distance).add(controls.target);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}fit();addEventListener('resize',fit);
try{
 const {scene:model}=await new GLTFLoader().loadAsync('../public/models/graduation-cap-green-gold.glb');
 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(m.normalMap)m.normalMap.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());}}});scene.add(model);document.body.dataset.loadState='ready';
}catch(error){document.body.dataset.loadState='error';const p=document.createElement('p');p.id='error';p.textContent='模型加载失败，请通过本地 HTTP 服务打开此页。';document.body.append(p);console.error(error)}
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{controls.update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)});
</script>
